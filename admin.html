<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 小鱼干的网站</title>
    <link rel="icon" type="image/svg+xml" href="images/Favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .admin-card {
            background: var(--card-bg);
            padding: 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 1rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th, .admin-table td {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            text-align: left;
        }
        .admin-table th {
            background: var(--accent);
            color: white;
        }
        .admin-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #22c55e;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
        }
        .empty {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
        }
        .badge-admin {
            background: #22c55e;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .badge-user {
            background: #6c757d;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .badge-published {
            background: #22c55e;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .badge-draft {
            background: #f59e0b;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .stat-card {
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            color: white;
        }
        .stat-card .number {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .stat-card .label {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .stat-blue { background: var(--accent); }
        .stat-green { background: #22c55e; }
        .stat-orange { background: #f59e0b; }
        .stat-purple { background: #8b5cf6; }
        .trend-chart {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 100px;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-top: 0.5rem;
        }
        .trend-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 20px;
        }
        .trend-bar {
            background: var(--accent);
            width: 100%;
            border-radius: 2px 2px 0 0;
            min-height: 2px;
            transition: height 0.3s ease;
        }
        .trend-date {
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .trend-count {
            font-size: 0.5rem;
            color: var(--text-muted);
        }

        /* 文章编辑器弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }
        .modal-overlay.active {
            display: block;
        }
        .modal-content {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-end);
            padding: 2rem;
            border-radius: 12px;
        }
        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }
        .modal-content textarea {
            min-height: 200px;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
        }
        .modal-actions .btn-save {
            background: var(--accent);
        }
        .modal-actions .btn-publish {
            background: #22c55e;
        }
        .modal-actions .btn-cancel {
            background: #6c757d;
        }

        @media (max-width: 700px) {
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th, .admin-table td {
                padding: 0.3rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .modal-overlay {
                padding: 1rem;
            }
            .modal-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="logo" href="index.html">小鱼干的个人网站</a>
            <button id="navToggle" class="nav-toggle">☰</button>
            <nav id="mainNav" class="main-nav">
                <a href="index.html">首页</a>
                <a href="about.html">关于</a>
                <a href="works.html">作品</a>
                <a href="articles.html">文章</a>
                <a href="contact.html">联系</a>
                <a href="account.html" style="color: var(--accent); font-weight: bold;">登录/注册</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="admin-container" id="adminApp">
            <div class="nav-bar">
                <h1>🔐 后台管理</h1>
                <div>
                    <span id="adminUser" style="margin-right: 1rem;"></span>
                    <button class="btn-danger" onclick="logout()" style="padding: 0.4rem 1rem;">登出</button>
                </div>
            </div>

            <div id="loginRequired" style="display: none; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 12px;">
                <p>🔒 请先登录</p>
                <p style="margin-top: 1rem;"><a href="account.html" class="btn">去登录</a></p>
            </div>

            <div id="notAdmin" style="display: none; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 12px;">
                <p>❌ 您不是管理员，无权访问后台</p>
                <p style="margin-top: 1rem;" id="redirectMsg">3 秒后跳转到首页...</p>
            </div>

            <div id="adminContent">
                <!-- ========== 访问统计 ========== -->
                <div class="admin-card">
                    <h2>📊 访问统计</h2>
                    <div class="stats-grid" id="statsOverview">
                        <div class="stat-card stat-blue">
                            <div class="number" id="statTotal">-</div>
                            <div class="label">总访问量</div>
                        </div>
                        <div class="stat-card stat-green">
                            <div class="number" id="statToday">-</div>
                            <div class="label">今日访问</div>
                        </div>
                        <div class="stat-card stat-orange">
                            <div class="number" id="statYesterday">-</div>
                            <div class="label">昨日访问</div>
                        </div>
                        <div class="stat-card stat-purple">
                            <div class="number" id="statUnique">-</div>
                            <div class="label">独立访客</div>
                        </div>
                    </div>
                    <div style="margin-top: 1rem;">
                        <h4 style="margin: 0 0 0.3rem 0;">📈 最近30天趋势</h4>
                        <div class="trend-chart" id="trendChart"></div>
                    </div>
                    <div style="margin-top: 1rem;">
                        <h4 style="margin: 0 0 0.3rem 0;">📄 热门页面</h4>
                        <div id="pageStats" style="font-size: 0.9rem;"></div>
                    </div>
                </div>

                <!-- ========== 文章管理 ========== -->
                <div class="admin-card">
                    <h2>📝 文章管理</h2>
                    <button id="newArticleBtn" class="btn-primary" style="margin-bottom: 1rem;">➕ 写新文章</button>
                    <div id="articleList"><div class="loading">加载中...</div></div>
                </div>

                <!-- ========== 用户管理 ========== -->
                <div class="admin-card">
                    <h2>👤 用户管理</h2>
                    <div id="userList"><div class="loading">加载中...</div></div>
                </div>

                <!-- ========== 评论管理 ========== -->
                <div class="admin-card">
                    <h2>💬 评论管理</h2>
                    <div id="commentList"><div class="loading">加载中...</div></div>
                </div>
            </div>
        </div>
    </main>

    <!-- ========== 文章编辑器弹窗 ========== -->
    <div class="modal-overlay" id="articleModal">
        <div class="modal-content">
            <h2 id="editorTitle">✏️ 写新文章</h2>
            <input type="text" id="articleTitle" placeholder="文章标题" />
            <input type="text" id="articleSummary" placeholder="文章摘要（可选）" />
            <textarea id="articleContent" placeholder="文章内容..."></textarea>
            <div style="margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="articlePublished" /> 发布
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-save" id="saveArticleBtn">💾 保存</button>
                <button class="btn btn-publish" id="publishArticleBtn">🚀 发布</button>
                <button class="btn btn-cancel" id="closeEditorBtn">取消</button>
            </div>
            <div id="editorMsg" style="margin-top: 0.5rem; color: #86efac;"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <small>© 2026 小鱼干。保留所有权利。</small>
        </div>
    </footer>

    <script>
        const API_BASE = 'https://xiaoyugan.pythonanywhere.com';
        let currentUser = null;
        let editingArticleId = null;

        function getToken() {
            return localStorage.getItem('access_token');
        }

        // ========== 认证检查 ==========
        async function checkAuth() {
            const token = getToken();
            if (!token) {
                document.getElementById('loginRequired').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data;
                    document.getElementById('adminUser').textContent = `👋 ${data.username}`;

                    if (!data.is_admin) {
                        document.getElementById('loginRequired').style.display = 'none';
                        document.getElementById('notAdmin').style.display = 'block';
                        document.getElementById('adminContent').style.display = 'none';
                        // 3秒后跳转首页
                        let count = 3;
                        const msgEl = document.getElementById('redirectMsg');
                        const interval = setInterval(() => {
                            count--;
                            if (count <= 0) {
                                clearInterval(interval);
                                window.location.href = 'https://xiaoyugan.qzz.io/index.html';
                            } else {
                                msgEl.textContent = `${count} 秒后跳转到首页...`;
                            }
                        }, 1000);
                        return;
                    }

                    document.getElementById('loginRequired').style.display = 'none';
                    document.getElementById('notAdmin').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    
                    loadStats();
                    loadPageStats();
                    loadArticles();
                    loadUsers();
                    loadComments();
                } else {
                    throw new Error('认证失败');
                }
            } catch (err) {
                document.getElementById('loginRequired').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
            }
        }

        // ========== 加载统计数据 ==========
        async function loadStats() {
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/stats/overview`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('statTotal').textContent = data.total_visits;
                    document.getElementById('statToday').textContent = data.today_visits;
                    document.getElementById('statYesterday').textContent = data.yesterday_visits;
                    document.getElementById('statUnique').textContent = data.unique_visitors;
                }

                const res2 = await fetch(`${API_BASE}/api/stats/daily`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res2.ok) {
                    const data = await res2.json();
                    const maxCount = Math.max(...data.map(d => d.count), 1);
                    const chart = document.getElementById('trendChart');
                    chart.innerHTML = data.map(d => `
                        <div class="trend-bar-wrapper">
                            <div class="trend-bar" style="height: ${(d.count / maxCount) * 80}px;"></div>
                            <div class="trend-date">${d.date.slice(5)}</div>
                            <div class="trend-count">${d.count}</div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }

        async function loadPageStats() {
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/stats/pages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('pageStats');
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">暂无数据</div>';
                        return;
                    }
                    container.innerHTML = data.map(p => 
                        `<div style="display: flex; justify-content: space-between; padding: 0.2rem 0; border-bottom: 1px solid var(--border);">
                            <span>${p.path}</span>
                            <span style="color: var(--accent); font-weight: bold;">${p.count}</span>
                        </div>`
                    ).join('');
                }
            } catch (err) {
                console.error('加载页面统计失败:', err);
            }
        }

        // ========== 文章管理 ==========
        async function loadArticles() {
            const token = getToken();
            const container = document.getElementById('articleList');
            try {
                const res = await fetch(`${API_BASE}/api/admin/articles`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const articles = await res.json();
                    if (articles.length === 0) {
                        container.innerHTML = '<div class="empty">暂无文章</div>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>标题</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${articles.map(a => `
                                    <tr>
                                        <td>${a.id}</td>
                                        <td>${a.title}</td>
                                        <td><span class="${a.is_published ? 'badge-published' : 'badge-draft'}">${a.is_published ? '✅ 已发布' : '📝 草稿'}</span></td>
                                        <td>${new Date(a.created_at).toLocaleString()}</td>
                                        <td>
                                            <button class="btn-warning" onclick="editArticle(${a.id})">✏️ 编辑</button>
                                            <button class="btn-danger" onclick="deleteArticle(${a.id})">🗑️ 删除</button>
                                            <button class="btn-success" onclick="togglePublish(${a.id}, ${a.is_published})">
                                                ${a.is_published ? '📥 撤回' : '🚀 发布'}
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty">网络错误</div>';
            }
        }

        // 打开文章编辑器
        function openEditor(article = null) {
            const modal = document.getElementById('articleModal');
            const title = document.getElementById('articleTitle');
            const summary = document.getElementById('articleSummary');
            const content = document.getElementById('articleContent');
            const published = document.getElementById('articlePublished');
            const editorTitle = document.getElementById('editorTitle');
            const msg = document.getElementById('editorMsg');

            msg.textContent = '';
            if (article) {
                editingArticleId = article.id;
                title.value = article.title || '';
                summary.value = article.summary || '';
                content.value = article.content || '';
                published.checked = article.is_published || false;
                editorTitle.textContent = '✏️ 编辑文章';
            } else {
                editingArticleId = null;
                title.value = '';
                summary.value = '';
                content.value = '';
                published.checked = false;
                editorTitle.textContent = '✏️ 写新文章';
            }
            modal.classList.add('active');
        }

        // 关闭编辑器
        function closeEditor() {
            document.getElementById('articleModal').classList.remove('active');
            editingArticleId = null;
        }

        // 保存文章
        async function saveArticle(publish = false) {
            const token = getToken();
            const title = document.getElementById('articleTitle').value.trim();
            const summary = document.getElementById('articleSummary').value.trim();
            const content = document.getElementById('articleContent').value.trim();
            const is_published = publish || document.getElementById('articlePublished').checked;
            const msg = document.getElementById('editorMsg');

            if (!title || !content) {
                msg.textContent = '⚠️ 标题和内容不能为空';
                msg.style.color = '#f87171';
                return;
            }

            const method = editingArticleId ? 'PUT' : 'POST';
            const url = editingArticleId 
                ? `${API_BASE}/api/admin/articles/${editingArticleId}`
                : `${API_BASE}/api/admin/articles`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, summary, content, is_published })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.textContent = `✅ ${publish ? '发布' : '保存'}成功！`;
                    msg.style.color = '#86efac';
                    setTimeout(() => {
                        closeEditor();
                        loadArticles();
                    }, 1000);
                } else {
                    msg.textContent = '❌ ' + (data.msg || '操作失败');
                    msg.style.color = '#f87171';
                }
            } catch (err) {
                msg.textContent = '❌ 网络错误';
                msg.style.color = '#f87171';
            }
        }

        // 编辑文章
        async function editArticle(id) {
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/articles`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const articles = await res.json();
                    const article = articles.find(a => a.id === id);
                    if (article) {
                        // 需要获取完整内容
                        const detailRes = await fetch(`${API_BASE}/api/articles/${id}`);
                        if (detailRes.ok) {
                            const detail = await detailRes.json();
                            openEditor({ ...article, content: detail.content });
                            return;
                        }
                        openEditor(article);
                    }
                }
            } catch (err) {
                alert('加载文章失败');
            }
        }

        // 删除文章
        async function deleteArticle(id) {
            if (!confirm('确定要删除这篇文章吗？')) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/articles/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg || '删除成功');
                    loadArticles();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // 切换发布状态
        async function togglePublish(id, currentStatus) {
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/articles/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ is_published: !currentStatus })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg || '操作成功');
                    loadArticles();
                } else {
                    alert(data.msg || '操作失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // ========== 加载用户 ==========
        async function loadUsers() {
            const token = getToken();
            const container = document.getElementById('userList');
            try {
                const res = await fetch(`${API_BASE}/api/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const users = await res.json();
                    if (users.length === 0) {
                        container.innerHTML = '<div class="empty">暂无用户</div>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>角色</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${users.map(u => `
                                    <tr>
                                        <td>${u.id}</td>
                                        <td>${u.username}</td>
                                        <td>${u.is_admin ? '<span class="badge-admin">管理员</span>' : '<span class="badge-user">普通用户</span>'}</td>
                                        <td>${u.created_at ? new Date(u.created_at).toLocaleString() : '-'}</td>
                                        <td>
                                            ${currentUser && currentUser.id !== u.id ? `
                                                <button class="btn-warning" onclick="toggleAdmin(${u.id}, ${u.is_admin})">
                                                    ${u.is_admin ? '撤销' : '设为'}管理员
                                                </button>
                                                <button class="btn-danger" onclick="deleteUser(${u.id})">删除</button>
                                            ` : `<span style="color: var(--text-muted); font-size: 0.8rem;">自己</span>`}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty">网络错误</div>';
            }
        }

        // ========== 加载评论 ==========
        async function loadComments() {
            const token = getToken();
            const container = document.getElementById('commentList');
            try {
                const res = await fetch(`${API_BASE}/api/admin/comments`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const comments = await res.json();
                    if (comments.length === 0) {
                        container.innerHTML = '<div class="empty">暂无评论</div>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户</th>
                                    <th>内容</th>
                                    <th>时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${comments.map(c => `
                                    <tr>
                                        <td>${c.id}</td>
                                        <td>${c.username}</td>
                                        <td style="max-width: 200px; word-break: break-word;">${c.content}</td>
                                        <td style="white-space: nowrap;">${new Date(c.created_at).toLocaleString()}</td>
                                        <td>
                                            <button class="btn-danger" onclick="adminDeleteComment(${c.id})">删除</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty">网络错误</div>';
            }
        }

        // ========== 管理操作 ==========
        async function toggleAdmin(userId, currentStatus) {
            if (!confirm(`确定要${currentStatus ? '撤销' : '设为'}该用户的管理员权限吗？`)) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}/toggle_admin`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg);
                    loadUsers();
                } else {
                    alert(data.msg || '操作失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        async function adminDeleteComment(id) {
            if (!confirm('确定要删除这条评论吗？')) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/comments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert('删除成功！');
                    loadComments();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        async function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？该用户的所有评论也会被删除！')) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg);
                    loadUsers();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'account.html';
        }

        // ========== 事件绑定 ==========
        document.getElementById('newArticleBtn').addEventListener('click', () => openEditor());
        document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
        document.getElementById('saveArticleBtn').addEventListener('click', () => saveArticle(false));
        document.getElementById('publishArticleBtn').addEventListener('click', () => saveArticle(true));

        // 点击遮罩关闭弹窗
        document.getElementById('articleModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditor();
        });

        // ========== 启动 ==========
        checkAuth();
    </script>
</body>
</html>
