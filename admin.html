<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 小鱼干的网站</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .admin-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th, .admin-table td {
            padding: 0.5rem;
            border: 1px solid var(--border);
            text-align: left;
        }
        .admin-table th {
            background: var(--accent);
            color: white;
        }
        .admin-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #22c55e;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .nav-bar a {
            color: var(--accent);
        }
        .loading {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
        }
        .empty {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
        }
        .badge-admin {
            background: #22c55e;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        .badge-user {
            background: #6c757d;
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
        }
        @media (max-width: 700px) {
            .admin-table {
                font-size: 0.7rem;
            }
            .admin-table th, .admin-table td {
                padding: 0.3rem;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="logo" href="index.html">小鱼干的个人网站</a>
            <button id="navToggle" class="nav-toggle">☰</button>
            <nav id="mainNav" class="main-nav">
                <a href="index.html">首页</a>
                <a href="about.html">关于</a>
                <a href="works.html">作品</a>
                <a href="contact.html">联系</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="admin-container" id="adminApp">
            <div class="nav-bar">
                <h1>🔐 后台管理</h1>
                <div>
                    <span id="adminUser" style="margin-right: 1rem;"></span>
                    <button class="btn-danger" onclick="logout()" style="padding: 0.4rem 1rem;">登出</button>
                </div>
            </div>

            <div id="loginRequired" style="display: none; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 8px;">
                <p>🔒 请先登录</p>
                <p style="margin-top: 1rem;"><a href="account.html" class="btn">去登录</a></p>
            </div>

            <div id="notAdmin" style="display: none; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 8px;">
                <p>❌ 您不是管理员，无权访问后台</p>
            </div>

            <div id="adminContent">
                <!-- 用户管理 -->
                <div class="admin-card">
                    <h2>👤 用户管理</h2>
                    <div id="userList"><div class="loading">加载中...</div></div>
                </div>

                <!-- 评论管理 -->
                <div class="admin-card">
                    <h2>💬 评论管理</h2>
                    <div id="commentList"><div class="loading">加载中...</div></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>© 2026 小鱼干。保留所有权利。</small>
        </div>
    </footer>

    <script>
        const API_BASE = 'https://xiaoyugan.pythonanywhere.com';
        let currentUser = null;

        function getToken() {
            return localStorage.getItem('access_token');
        }

        function redirectToLogin() {
            window.location.href = 'account.html?from=admin';
        }

        async function checkAuth() {
            const token = getToken();
            if (!token) {
                document.getElementById('loginRequired').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
                return false;
            }

            try {
                const res = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data;
                    document.getElementById('adminUser').textContent = `👋 ${data.username}`;

                    if (!data.is_admin) {
                        document.getElementById('loginRequired').style.display = 'none';
                        document.getElementById('notAdmin').style.display = 'block';
                        document.getElementById('adminContent').style.display = 'none';
                        return false;
                    }

                    document.getElementById('loginRequired').style.display = 'none';
                    document.getElementById('notAdmin').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    loadUsers();
                    loadComments();
                    return true;
                } else {
                    throw new Error('认证失败');
                }
            } catch (err) {
                document.getElementById('loginRequired').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
                return false;
            }
        }

        async function loadUsers() {
            const token = getToken();
            const container = document.getElementById('userList');
            try {
                const res = await fetch(`${API_BASE}/api/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const users = await res.json();
                    if (users.length === 0) {
                        container.innerHTML = '<div class="empty">暂无用户</div>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>角色</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${users.map(u => `
                                    <tr>
                                        <td>${u.id}</td>
                                        <td>${u.username}</td>
                                        <td>${u.is_admin ? '<span class="badge-admin">管理员</span>' : '<span class="badge-user">普通用户</span>'}</td>
                                        <td>${u.created_at ? new Date(u.created_at).toLocaleString() : '-'}</td>
                                        <td>
                                            ${currentUser && currentUser.id !== u.id ? `
                                                <button class="btn-warning" onclick="toggleAdmin(${u.id}, ${u.is_admin})">
                                                    ${u.is_admin ? '撤销' : '设为'}管理员
                                                </button>
                                                <button class="btn-danger" onclick="deleteUser(${u.id})">删除</button>
                                            ` : `<span style="color: var(--text-muted); font-size: 0.8rem;">自己</span>`}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty">网络错误</div>';
            }
        }

        async function loadComments() {
            const token = getToken();
            const container = document.getElementById('commentList');
            try {
                const res = await fetch(`${API_BASE}/api/admin/comments`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const comments = await res.json();
                    if (comments.length === 0) {
                        container.innerHTML = '<div class="empty">暂无评论</div>';
                        return;
                    }
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户</th>
                                    <th>内容</th>
                                    <th>时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${comments.map(c => `
                                    <tr>
                                        <td>${c.id}</td>
                                        <td>${c.username}</td>
                                        <td style="max-width: 200px; word-break: break-word;">${c.content}</td>
                                        <td style="white-space: nowrap;">${new Date(c.created_at).toLocaleString()}</td>
                                        <td>
                                            <button class="btn-danger" onclick="adminDeleteComment(${c.id})">删除</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty">网络错误</div>';
            }
        }

        // 切换管理员
        async function toggleAdmin(userId, currentStatus) {
            if (!confirm(`确定要${currentStatus ? '撤销' : '设为'}该用户的管理员权限吗？`)) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}/toggle_admin`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg);
                    loadUsers();
                } else {
                    alert(data.msg || '操作失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // 管理员删除评论
        async function adminDeleteComment(id) {
            if (!confirm('确定要删除这条评论吗？')) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/comments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert('删除成功！');
                    loadComments();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // 删除用户
        async function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？该用户的所有评论也会被删除！')) return;
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.msg);
                    loadUsers();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'account.html';
        }

        // 页面加载
        checkAuth();
    </script>
</body>
</html>
