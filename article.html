<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>文章详情 - 小鱼干的网站</title>
  <link rel="icon" type="image/svg+xml" href="images/Favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">小鱼干的个人网站</a>
      <button id="navToggle" class="nav-toggle">☰</button>
      <nav id="mainNav" class="main-nav">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <a href="works.html">作品</a>
        <a href="articles.html">文章</a>
        <a href="contact.html">联系</a>
        <a href="account.html" style="color: var(--accent); font-weight: bold;">登录/注册</a>
        <button id="themeToggle" class="theme-toggle">🌙</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="container section">
      <div id="article-content">
        <p style="text-align: center; color: var(--text-muted);">⏳ 加载中...</p>
      </div>
      <a href="articles.html" class="btn" style="margin-top: 2rem;">← 返回文章列表</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 小鱼干。保留所有权利。</small>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    // ⚠️ 不要重复声明 API_BASE，script.js 里已经有了

    async function loadArticle() {
      const container = document.getElementById('article-content');
      
      // 从 URL 获取文章 ID
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      console.log('🔍 文章 ID:', id);
      
      if (!id) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">❌ 文章 ID 缺失</p>';
        return;
      }

      try {
        const url = `${API_BASE}/api/articles/${id}`;
        console.log('📡 请求地址:', url);
        
        const res = await fetch(url);
        console.log('📡 响应状态:', res.status);
        
        if (!res.ok) {
          if (res.status === 404) {
            container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">📭 文章不存在或未发布</p>';
          } else {
            container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">❌ 加载失败 (状态码: ${res.status})</p>`;
          }
          return;
        }
        
        const a = await res.json();
        console.log('📝 文章数据:', a);
        
        container.innerHTML = `
          ${a.cover_image ? `<img src="${a.cover_image}" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem;" />` : ''}
          <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${a.title}</h1>
          <p style="color: var(--text-muted); margin-bottom: 1rem;">${a.author} · ${new Date(a.created_at).toLocaleString()}</p>
          <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; line-height: 1.8; white-space: pre-wrap;">${a.content}</div>
        `;
      } catch (err) {
        console.error('❌ 加载文章失败:', err);
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">❌ 网络错误，请稍后重试</p>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
